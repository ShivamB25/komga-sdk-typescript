name: Publish Package

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # Required for npm Trusted Publishing (OIDC)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "latest"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Upgrade npm for OIDC support
        run: npm install -g npm@latest
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Test
        run: bun run test

      - name: Verify tag matches package version
        if: github.ref_type == 'tag'
        run: |
          bun -e "import pkg from './package.json'; const tag = process.env.GITHUB_REF_NAME?.replace(/^v/, ''); if (pkg.version !== tag) { console.error('Tag v' + tag + ' does not match package.json version ' + pkg.version); process.exit(1); }"

      - name: Publish to npm
        run: npm publish --access public
        env:
          # Explicitly empty to force OIDC authentication
          NODE_AUTH_TOKEN: ''
