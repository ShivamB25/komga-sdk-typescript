name: Publish Package

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "latest"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Verify tag matches package version
        if: github.ref_type == 'tag'
        run: |
          bun -e "import pkg from './package.json'; const tag = process.env.GITHUB_REF_NAME?.replace(/^v/, ''); if (pkg.version !== tag) { console.error('Tag v' + tag + ' does not match package.json version ' + pkg.version); process.exit(1); }"

      - name: Publish to npm
        run: bun publish --access public
        env:
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}
